<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Phiếu mượn')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main>
    <div class="toolbar"><h1>Phiếu mượn</h1><a class="button" th:href="@{/borrowings/new}">Tạo phiếu mượn</a></div>
    <section class="panel">
        <table>
            <thead><tr><th>Mã</th><th>Thành viên</th><th>Ngày mượn</th><th>Hạn trả</th><th>Trạng thái</th><th>Tiền phạt</th><th></th></tr></thead>
            <tbody>
            <tr th:each="borrowing : ${borrowings.content}">
                <td th:text="${borrowing.id}"></td>
                <td th:text="${borrowing.member.fullName}"></td>
                <td th:text="${borrowing.borrowDate}"></td>
                <td th:text="${borrowing.dueDate}"></td>
                <td th:text="${borrowing.status}"></td>
                <td th:text="${borrowing.totalFine}"></td>
                <td><a class="button secondary" th:href="@{/borrowings/{id}(id=${borrowing.id})}">Chi tiết</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
